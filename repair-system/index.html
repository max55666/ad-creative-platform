const blocks=[["寄送內容物確認", "<p>請確認寄回的箱內僅包含指定物件：</p>\n<ul><li><strong>主機本體</strong></li><li><strong>電源線</strong></li></ul>\n<div class=\"notice\">貓砂倉、支撐腳、集便盒無需寄回。</div>\n<figure class=\"return-items\"><img src=\"/assets/return-items.png\" width=\"668\" height=\"432\" alt=\"AS11 與 AS12 Lite 寄回內容物示意：主機本體與電源線\"><figcaption>寄回內容物示意：請依你的機型寄回主機本體與電源線。</figcaption></figure>", "我已確認箱內只有主機本體與電源線。"], ["機器清潔狀態確認", "<ul>\n<li>裝箱前，請先將主機進行基本清潔。</li>\n<li>檢修服務不包含清潔作業。</li>\n<li>若主機有嚴重髒污、殘留大量貓砂、尿液或其他排泄物，可能影響檢測與維修，並可能產生額外清潔費用。</li>\n<li>如需額外清潔，客服將先說明相關費用後再進行後續處理。</li>\n</ul>", "我已理解清潔規範。"], ["包裝與運送責任聲明", "<ul>\n<li>請使用足夠強度的紙箱及完整緩衝材料（如氣泡紙、保麗龍），並確保機器在箱內不晃動。</li>\n<li>妥善包裝可降低運送過程中的碰撞與損傷風險；如對包裝方式有疑問，請先聯絡客服確認。</li>\n</ul>\n<div class=\"panel responsibility\">本公司係依客戶提供之包裝進行回收與寄送，無法逐一檢驗其防護強度與完整性。<br><strong>👉 因此，如因包裝不當、緩衝不足或固定不良，導致運送過程中產生之碰撞、外觀損傷或內部故障，相關風險與責任將由包裝提供方（即客戶）自行承擔，本公司恕不負相關賠償責任，亦不列入保固範圍。</strong></div>", "我已詳閱包裝運送說明。"], ["寄送方式、費用與時間", "<div class=\"panel shipping-intro\"><strong>送修商品寄送方式</strong><p>送修商品可自行安排物流寄送、聯絡客服協助安排付費到府收件，或親自送回。</p></div>\n<div class=\"panel shipping-self\"><h4><span class=\"shipping-tag\">自行寄送</span> 自行安排物流</h4>\n<p>請先完成申請並等候客服確認。若有應付費用，請於付款核對成功後，再將已清潔且妥善包裝的商品安排寄送：</p>\n<ul><li><strong>收件地址請參考下方「公司收件資訊」。</strong></li><li>寄送前請確認應寄回的主機、電源與指定配件。</li></ul>\n<div class=\"shipping-callout\"><strong>寄送內容或包裝方式如有疑問，請先聯絡客服確認。</strong></div></div>\n<div class=\"panel shipping-pickup\"><h4><span class=\"shipping-tag\">代派車收件</span> 由客服協助安排</h4>\n<p>如需本公司協助安排合作物流到府收件，請先聯絡客服登記。</p>\n<div class=\"shipping-callout\"><strong>代派車收件服務費為 NT$350；即使核定免維修費，仍需支付回收運費。</strong></div>\n<p>回收服務僅限台灣本島。離島因無配合物流，可選擇自行寄送，使用郵局郵寄。</p>\n<div class=\"shipping-callout\"><strong>請先完成申請並等候客服核價。</strong></div>\n<p>客服核定費用後會透過 LINE 提供付款連結，付款核對成功後才安排回收。實際收件時間以客服與合作物流安排為準；收件前請完成清潔與妥善包裝。</p></div>\n<div class=\"panel shipping-self\"><h4><span class=\"shipping-tag\">親自送回</span> 管理室收件</h4><p>親自送回時，請先將商品妥善裝箱，並交由管理室代收。為維護商品安全，未裝箱之商品，管理室恕無法代收，敬請見諒。</p><ul><li>若技師評估包裝強度不足，可能於運送途中造成商品損壞，為保障商品安全，我們將於維修完成後通知您親自領回。</li><li><strong>若您了解上述風險後，仍選擇以寄送方式領回，運送途中之商品損壞風險須由您自行承擔，本公司恕無法負擔相關損壞之賠償責任。</strong></li></ul><p>收件地址請參考下方「公司收件資訊」。</p></div>\n<h4>保固期滿維修說明</h4>\n<ul><li>超過保固期限，送修將酌收基本檢測費 NT$500。</li>\n<li>檢測後，技師會依故障情況提供維修報價；經客戶同意後才進行維修。</li>\n<li>若檢測後選擇不維修，仍須支付基本檢測費。</li></ul>\n<h4>公司收件資訊</h4>\n<div class=\"company-address\">收件人：瑞檬行銷<br>聯絡電話：0971-693-287 （僅供物流聯繫，非客服專線）<br>收件地址：新北市新莊區新北大道四段187號4樓之2</div>\n<h4>維修時程</h4>\n<p>產品送達後，檢測及維修約需 5～14 個工作天（不含例假日及物流往返時間）；實際完成時間依故障情況及零件備料狀況調整。</p>", "我已了解寄送方式與資訊。"]];
function renderRules(){app.innerHTML+='<div class="card"><div class="section-label">STEP 01</div><h2>送修前必讀規範</h2><p class="muted">為了能快速且順利地為你的機器進行檢測與維修，請逐項閱讀以下檢修與運送說明。四項皆勾選確認後，才能進入申請表。</p><div class="notice"><strong>填表後的費用與付款流程</strong><ol class="payment-flow"><li><strong>客服核定費用</strong><span>如需檢測費、維修費或回收運費，客服會先確認金額。</span></li><li><strong>收到 LINE 付款連結</strong><span>請依通知金額完成付款。</span></li><li><strong>核對成功，再進行檢修</strong><span>付款核對成功後，才安排後續檢測與維修。</span></li></ol><p>若客服核定免付款，請依客服確認的送修方式辦理。</p></div></div>'+blocks.map((b,i)=>'<section class="card rules-card"><h3><span class="num">'+(i+1)+'</span>'+b[0]+'</h3>'+b[1]+'<label class="check"><input type="checkbox" '+(rules[i]?'checked':'')+' onchange="rules['+i+']=this.checked;updateNext()"><strong>'+b[2]+'</strong></label></section>').join('')+'<button id="next" class="wide" onclick="step=2;render();window.scrollTo(0,0)">下一步：填寫申請資料</button><p class="footer">點擊下一步，即表示你已閱讀並同意以上檢修、收送與費用規範。</p>';updateNext()}
function updateNext(){let b=document.getElementById('next');b.disabled=!rules.every(Boolean);b.textContent=b.disabled?'請勾選全部四項規範':'下一步：填寫申請資料'}
let draft={};function field(label,name,required=false,type='text',full=false){const attributes={name:' autocomplete="name"',phone:' autocomplete="tel" inputmode="tel"',email:' autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"',order:' autocapitalize="none" autocorrect="off" spellcheck="false"',serial:' aria-describedby="serialHint" autocapitalize="none" autocorrect="off" spellcheck="false"',model:' autocapitalize="none" autocorrect="off" spellcheck="false"'};return '<label class="field '+(full?'full':'')+'">'+label+(required?' <span class="required">*</span>':'')+'<input name="'+name+'" type="'+type+'" '+(required?'required':'')+' maxlength="300"'+(attributes[name]||'')+' value="'+esc(draft[name]||'')+'"></label>'}

function normalizeAddressName(value){return String(value||'').trim().replace(/台/g,'臺')}
function addressCity(city){return addressData.cities.find(item=>item.name===normalizeAddressName(city))}
function addressIsOffshore(city,district=''){return addressData.offshore.some(item=>item.city===normalizeAddressName(city)&&(item.districts==='*'||item.districts.includes(normalizeAddressName(district))))}
function addressFields(prefix,title){
  const city=normalizeAddressName(draft[prefix+'City']);
  const district=normalizeAddressName(draft[prefix+'District']);
  const pickup=prefix==='pickup';
  const cities=addressData.cities.map(item=>'<option value="'+esc(item.name)+'"'+(city===item.name?' selected':'')+(pickup&&addressIsOffshore(item.name)?' disabled':'')+'>'+esc(item.name)+(pickup&&addressIsOffshore(item.name)?'（不提供回收）':'')+'</option>').join('');
  const districts=(addressCity(city)?.districts||[]).map(name=>'<option value="'+esc(name)+'"'+(district===name?' selected':'')+(pickup&&addressIsOffshore(city,name)?' disabled':'')+'>'+esc(name)+(pickup&&addressIsOffshore(city,name)?'（不提供回收）':'')+'</option>').join('');
  return '<fieldset id="'+prefix+'AddressFields" class="address-fields full"><legend>'+title+' <span class="required">*</span></legend><div class="address-grid"><label class="field">縣市<select name="'+prefix+'City" required autocomplete="section-'+prefix+' address-level1" onchange="addressCityChange(\''+prefix+'\')"><option value="">請選擇縣市</option>'+cities+'</select></label><label class="field">鄉鎮市區<select name="'+prefix+'District" required autocomplete="section-'+prefix+' address-level2"'+(!city?' disabled':'')+' onchange="addressDistrictChange(\''+prefix+'\')"><option value="">'+(city?'請選擇鄉鎮市區':'請先選擇縣市')+'</option>'+districts+'</select></label><label class="field street-field">路名與門牌（含樓層）<input name="'+prefix+'Street" required maxlength="500" autocomplete="section-'+prefix+' address-line1" placeholder="例如：中正路 123 號 4 樓之 2" value="'+esc(draft[prefix+'Street']||'')+'" oninput="syncAddress(\''+prefix+'\')"></label></div><input type="hidden" name="'+prefix+'Address"><p class="muted">'+(pickup?'回收服務僅限台灣本島，離島區域不提供客服物流回收。':'請先選縣市與鄉鎮市區，下方只需填寫路名、門牌與樓層。')+'</p></fieldset>';
}
function syncAddress(prefix){
  const f=document.getElementById('repairForm');
  f.elements[prefix+'Address'].value=f.elements[prefix+'City'].value+f.elements[prefix+'District'].value+f.elements[prefix+'Street'].value.trim();
  if(prefix==='return')pickupSameChange();
}
function addressCityChange(prefix){
  const f=document.getElementById('repairForm'),city=f.elements[prefix+'City'].value,district=f.elements[prefix+'District'];
  district.innerHTML='<option value="">'+(city?'請選擇鄉鎮市區':'請先選擇縣市')+'</option>'+(addressCity(city)?.districts||[]).map(name=>'<option value="'+esc(name)+'"'+(prefix==='pickup'&&addressIsOffshore(city,name)?' disabled':'')+'>'+esc(name)+(prefix==='pickup'&&addressIsOffshore(city,name)?'（不提供回收）':'')+'</option>').join('');
  district.disabled=!city;
  syncAddress(prefix);if(prefix==='return')updatePickupAvailability();
}
function addressDistrictChange(prefix){syncAddress(prefix);if(prefix==='return')updatePickupAvailability()}
function updatePickupAvailability(){
  const f=document.getElementById('repairForm'),city=f.elements.returnCity.value,district=f.elements.returnDistrict.value;
  const valid=!!addressCity(city)?.districts.includes(district),offshore=addressIsOffshore(city,district),blocked=!valid||offshore;
  const option=document.getElementById('pickupShippingOption'),hint=document.getElementById('pickupServiceHint');
  option.disabled=blocked;
  option.textContent=offshore?'客服物流回收（僅限台灣本島）':!valid?'客服物流回收（請先選擇地址）':'客服物流回收（NT$350）';
  const changed=blocked&&f.elements.shipping.value==='由客服派遣物流回收';
  if(changed)f.elements.shipping.value='自行寄送';
  hint.className=offshore?'notice pickup-limit':'muted';
  hint.textContent=(changed?'已改為「自行寄送」。':'')+(offshore?'你選擇的寄回地址位於離島，無法選擇客服物流回收。回收服務僅限台灣本島；離島因無配合物流，可選擇「自行寄送」，使用郵局郵寄。':!valid?'請先選擇上方寄回地址的縣市與鄉鎮市區。回收服務僅限台灣本島；離島可選擇「自行寄送」，使用郵局郵寄。':'回收服務僅限台灣本島。離島因無配合物流，可選擇「自行寄送」，使用郵局郵寄。');
  shippingChange();
}

function orderFields(){return '<fieldset class="order-options full"><legend>訂單編號 <span class="required">*</span></legend><div class="order-choices"><label class="check"><input type="radio" name="orderChoice" value="provided" required '+(draft.orderChoice==='provided'?'checked':'')+' onchange="orderChange()"><span>有訂單編號</span></label><label class="check"><input type="radio" name="orderChoice" value="missing" required '+(draft.orderChoice==='missing'?'checked':'')+' onchange="orderChange()"><span>無訂單編號／不記得了</span></label></div><div id="orderNumberField" class="hidden">'+field('請填寫訂單編號','order',true)+'<p class="muted">保固狀態將由客服依訂單資料核對。</p></div><div id="orderPaidNotice" class="notice hidden">無法提供訂單編號，將依保固外付費維修處理。送修將酌收基本檢測費 NT$500，檢測後提供維修報價；經你同意後才進行維修。應付費用由客服核定後透過 LINE 提供付款連結，付款核對成功後才進行對應的檢修處理。</div></fieldset>'}
function orderChange(){const f=document.getElementById('repairForm');const choice=f.elements.orderChoice.value;const provided=choice==='provided';document.getElementById('orderNumberField').classList.toggle('hidden',!provided);document.getElementById('orderPaidNotice').classList.toggle('hidden',choice!=='missing');f.elements.order.required=provided;f.elements.order.disabled=!provided;f.elements.order.oninput=validateOrder;validateOrder()}
function validateOrder(){const f=document.getElementById('repairForm');const input=f.elements.order;input.setCustomValidity(!input.disabled&&input.value&&!input.value.trim()?'請填寫有效的訂單編號，或選擇無訂單編號／不記得了。':'')}
function orderChoiceLabel(c){return c.data.orderChoice==='provided'?'有訂單編號':c.data.orderChoice==='missing'?'無訂單編號／不記得了':'未記錄（舊案件）'}

function renderForm(){app.innerHTML+='<button class="outline wide" onclick="saveDraft();step=1;render()" style="margin-bottom:18px">← 返回查看送修規範</button><form id="repairForm"><section class="card"><div class="section-label">STEP 02</div><h2>聯絡與商品資料</h2><p class="muted">請填寫可以聯繫到你的資料，以便安排後續作業。</p><div class="grid">'+field('姓名','name',true)+field('聯絡電話','phone',true,'tel')+''+addressFields('return','維修完成後寄回地址')+''+field('電子郵件','email',false,'email',true)+field('商品型號','model',true)+'<div>'+field('商品序號','serial')+'<p id="serialHint" class="muted" style="margin:6px 0 0">請填寫機身側邊SN序號碼</p></div>'+field('購買通路','purchase')+orderFields()+'</div></section><section class="card"><h3 class="form-section-title">寄送方式</h3><label class="field">寄送方式 <span class="required">*</span><select name="shipping" required aria-describedby="pickupServiceHint" onchange="shippingChange()"><option value="自行寄送">自行寄送</option><option id="pickupShippingOption" value="由客服派遣物流回收">客服物流回收（NT$350）</option><option value="親自送回">親自送回</option></select></label><p id="pickupServiceHint" class="muted" role="status" aria-live="polite"></p><div id="pickupNotice" class="notice hidden">由客服派遣物流回收需收取運費 NT$350；即使核定免維修費，仍需支付回收運費。客服核定金額後會透過 LINE 提供付款連結，付款核對成功後才安排回收。</div><div id="pickup" class="hidden"><h4 class="pickup-address-title">到府取件地址 <span class="required">*</span></h4><label class="check"><input type="checkbox" name="pickupSameAsReturn" onchange="pickupSameChange()" aria-controls="pickupAddressFields pickupSameSummary" '+(draft.pickupSameAsReturn===true?'checked':'')+'><span>與寄回地址相同</span></label><div id="pickupSameSummary" class="notice pickup-same-summary hidden" role="status" aria-live="polite"><strong>將使用以下地址取件</strong><div id="pickupSameAddressText"></div><p class="muted">修改上方寄回地址時，取件地址也會同步更新。</p></div>'+addressFields('pickup','另外填寫取件地址')+'</div><div id="dropoffNotice" class="notice hidden" role="status"><strong>親自送回注意事項</strong><p>親自送回時，請先將商品妥善裝箱，並交由管理室代收。為維護商品安全，未裝箱之商品，管理室恕無法代收，敬請見諒。</p><ul><li>若技師評估包裝強度不足，可能於運 function shippingChange(){
  const f=document.getElementById('repairForm');
  if(document.getElementById('pickupShippingOption').disabled&&f.elements.shipping.value==='由客服派遣物流回收')f.elements.shipping.value='自行寄送';
  const yes=f.elements.shipping.value==='由客服派遣物流回收';
  document.getElementById('pickup').classList.toggle('hidden',!yes);
  f.elements.pickupSameAsReturn.disabled=!yes;
  document.getElementById('pickupNotice').classList.toggle('hidden',!yes);
  document.getElementById('dropoffNotice').classList.toggle('hidden',f.elements.shipping.value!=='親自送回');
  syncAddress('pickup');pickupSameChange();
}

function pickupSameChange(){
  const f=document.getElementById('repairForm');if(!f)return;
  const yes=f.elements.shipping.value==='由客服派遣物流回收',same=f.elements.pickupSameAsReturn.checked;
  const fields=document.getElementById('pickupAddressFields');
  fields.disabled=!yes||same;fields.classList.toggle('hidden',same);
  document.getElementById('pickupSameSummary').classList.toggle('hidden',!yes||!same);
  const complete=f.elements.returnCity.value&&f.elements.returnDistrict.value&&f.elements.returnStreet.value.trim();
  document.getElementById('pickupSameAddressText').textContent=complete?f.elements.returnAddress.value:'請先完整填寫上方寄回地址。';
}

function shippingFeeLabel(c){return c.data.pickupFeeTwd===350?'NT$350':''}

function saveDraft(){
  const f=document.getElementById('repairForm');if(!f)return;
  draft=Object.fromEntries(new FormData(f));
  draft.pickupSameAsReturn=f.elements.pickupSameAsReturn.checked;
  // Keep a separately entered address when the checkbox is toggled or rules are revisited.
  for(const part of ['City','District','Street','Address'])draft['pickup'+part]=f.elements['pickup'+part].value;
}
function submissionDraft(){
  const data={...draft},pickup=data.shipping==='由客服派遣物流回收';
  data.pickupSameAsReturn=pickup&&draft.pickupSameAsReturn===true;
  if(data.pickupSameAsReturn)for(const part of ['City','District','Street','Address'])data['pickup'+part]=data['return'+part];
  if(!pickup){for(const part of ['City','District','Street'])delete data['pickup'+part];data.pickupAddress='';}
  return data;
}
